<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Panel de Administración</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="admin-content">
  <!-- Tarjetas de opciones -->
  <div class="grid-container">
    <ion-card 
      *ngFor="let card of cards"
      class="feature-card" 
      (click)="navigateTo(card.route)"
      @cardAnimation>
      <ion-card-header>
        <ion-icon [name]="card.icon" class="card-icon"></ion-icon>
        <ion-card-title>{{ card.title }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        {{ card.description }}
      </ion-card-content>
    </ion-card>
  </div>

  <!-- Estadísticas -->
  <ion-grid class="stats-grid">
    <ion-row>
      <ion-col size="6">
        <div class="stat-card">
          <h3>Vigilantes Activos</h3>
          <p class="stat-value">{{ activeGuards }}</p>
        </div>
      </ion-col>
      <ion-col size="6">
        <div class="stat-card">
          <h3>Vehículos Hoy</h3>
          <p class="stat-value">{{ todayVehicles }}</p>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
